name: Build & Release APK

# Ad ogni push sulla repo viene eseguita la build Android e viene
# pubblicata una Release GitHub con gli APK allegati.
on:
  push:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build-and-release:
    runs-on: ubuntu-latest

    env:
      # Facoltativo: codifica base64 del keystore di release (vedi README).
      # Se non impostato l'APK viene firmato con la chiave debug (installabile comunque).
      KEYSTORE_B64: ${{ secrets.KEYSTORE_B64 }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Configure release keystore (opzionale)
        if: ${{ env.KEYSTORE_B64 != '' }}
        run: |
          echo "$KEYSTORE_B64" | base64 -d > "$GITHUB_WORKSPACE/release.jks"
          cat > "$GITHUB_WORKSPACE/keystore.properties" <<EOF
          storeFile=release.jks
          storePassword=${{ secrets.KEYSTORE_STORE_PASSWORD }}
          keyAlias=${{ secrets.KEYSTORE_KEY_ALIAS }}
          keyPassword=${{ secrets.KEYSTORE_KEY_PASSWORD }}
          EOF

      - name: Build release APK
        run: |
          chmod +x ./gradlew
          ./gradlew assembleRelease -PciRunNumber=${{ github.run_number }} --stacktrace

      - name: Rename APK per ABI
        run: |
          VERSION="1.0.${{ github.run_number }}"
          cd app/build/outputs/apk/release
          for f in app-*.apk; do
            abi="${f#app-}"
            abi="${abi%-release.apk}"
            mv "$f" "ytmp3-${VERSION}-${abi}.apk"
          done
          ls -la

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: "ytmp3 v1.0.${{ github.run_number }}"
          prerelease: false
          make_latest: true
          generate_release_notes: true
          fail_on_unmatched_files: true
          files: app/build/outputs/apk/release/ytmp3-*.apk
          body: |
            Build automatica da `${{ github.sha }}` (${{ github.ref_name }}).

            - `universal` funziona su qualsiasi dispositivo
            - oppure scarica l'APK dedicato alla tua architettura (`arm64-v8a` quasi tutti i dispositivi moderni)
